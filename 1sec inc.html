<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>자동 증가 카운터</title>
  <style>
    :root{
      --bg: linear-gradient(180deg,#f8fbff,#eef6ff);
      --card:#ffffff;
      --accent:#2b90ff;
      --accent-2:#ff7a59;
      --muted:#6b7280;
      --glass: rgba(255,255,255,0.6);
      font-family: 'Noto Sans KR', system-ui, -apple-system, Arial, sans-serif;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:#111}
    .wrap{max-width:920px;margin:36px auto;padding:24px}
    .card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 8px 30px rgba(30,40,80,0.06);margin-bottom:18px}
    header{display:flex;align-items:center;gap:16px}
    .logo{width:64px;height:64px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px}
    h1{font-size:1.4rem;margin:0}
    p.lead{margin:6px 0 0;color:var(--muted);font-size:0.95rem}
    .counter-area{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
    .display{
      flex:1;
      min-width:260px;
      border-radius:12px;padding:24px;text-align:center;background:linear-gradient(180deg,#ffffff,#f5fbff);box-shadow:inset 0 -4px 12px rgba(0,0,0,0.02);
    }
    .big-num{font-size:3.6rem;font-weight:800;letter-spacing: -0.03em}
    .label{color:var(--muted);margin-top:6px}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    button.btn{border:0;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:600}
    button.primary{background:var(--accent);color:#fff}
    button.ghost{background:#f1f5f9;color:#111}
    .settings{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
    .row{display:flex;flex-direction:column;gap:6px}
    input[type=number], input[type=range], select{padding:8px;border-radius:8px;border:1px solid #e6eef9}
    .history{max-height:180px;overflow:auto;padding:10px;border-radius:8px;background:#fbfdff;border:1px dashed #e8f0ff;font-size:0.95rem}
    .history-item{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px solid rgba(0,0,0,0.03)}
    .tiny{font-size:0.85rem;color:var(--muted)}
    footer{margin-top:10px;text-align:center;color:var(--muted);font-size:0.9rem}
    @media(max-width:760px){
      .settings{grid-template-columns:1fr}
      .counter-area{flex-direction:column;align-items:stretch}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="card">
      <div class="logo">CNT</div>
      <div>
        <h1>자동 증가 카운터</h1>
        <p class="lead">1초마다 숫자가 자동으로 증가합니다. 속도·증가값을 바꿔보세요.</p>
      </div>
    </header>

    <section class="card">
      <div class="counter-area">
        <div class="display" aria-live="polite" aria-atomic="true">
          <div class="big-num" id="display">0</div>
          <div class="label">현재 값</div>

          <div class="controls" style="justify-content:center;margin-top:14px">
            <button class="btn primary" id="startPause">시작</button>
            <button class="btn ghost" id="stepOnce">한 번 증가</button>
            <button class="btn ghost" id="resetBtn">리셋</button>
            <button class="btn ghost" id="saveBtn">로컬 저장</button>
            <button class="btn ghost" id="downloadHistory">히스토리 다운로드</button>
          </div>
        </div>

        <div style="flex:0 0 360px">
          <div class="settings">
            <div class="row">
              <label class="tiny">간격 (ms)</label>
              <input type="number" id="intervalInput" min="100" step="100" value="1000" aria-label="간격 밀리초">
              <div class="tiny">현재는 <span id="intervalLabel">1000</span> ms</div>
            </div>

            <div class="row">
              <label class="tiny">증가값 (step)</label>
              <input type="number" id="stepInput" min="1" step="1" value="1" aria-label="증가값">
              <div class="tiny">한 번에 <span id="stepLabel">1</span>씩 증가</div>
            </div>

            <div class="row">
              <label class="tiny">자동 시작</label>
              <select id="autoStart">
                <option value="false">아니오</option>
                <option value="true">예</option>
              </select>
              <div class="tiny">페이지 로드 시 자동으로 시작합니다.</div>
            </div>

            <div class="row">
              <label class="tiny">포맷</label>
              <select id="formatSelect">
                <option value="normal">일반 숫자</option>
                <option value="comma">천 단위 콤마</option>
                <option value="fixed2">소수 2자리 (고정)</option>
              </select>
            </div>

            <div class="row">
              <label class="tiny">최대값 (선택)</label>
              <input type="number" id="maxValue" placeholder="비워두면 제한 없음">
              <div class="tiny">최대값 도달 시 자동 일시정지</div>
            </div>

            <div class="row">
              <label class="tiny">사운드</label>
              <select id="soundSelect">
                <option value="none">없음</option>
                <option value="beep">삐 소리</option>
              </select>
              <div class="tiny">증가할 때 소리 재생</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h3 style="margin:0">히스토리</h3>
        <div class="tiny">최근 동작이 기록됩니다 (로컬스토리지)</div>
      </div>
      <div class="history" id="history"></div>
    </section>

    <footer>이 파일을 저장하여 배포하면 누구나 열어 사용할 수 있습니다. (로컬 저장 기능은 브라우저의 localStorage 사용)</footer>
  </div>

  <script>
    // 요소
    const display = document.getElementById('display');
    const startPauseBtn = document.getElementById('startPause');
    const stepOnceBtn = document.getElementById('stepOnce');
    const resetBtn = document.getElementById('resetBtn');
    const saveBtn = document.getElementById('saveBtn');
    const downloadHistoryBtn = document.getElementById('downloadHistory');

    const intervalInput = document.getElementById('intervalInput');
    const intervalLabel = document.getElementById('intervalLabel');
    const stepInput = document.getElementById('stepInput');
    const stepLabel = document.getElementById('stepLabel');
    const autoStartSel = document.getElementById('autoStart');
    const formatSelect = document.getElementById('formatSelect');
    const maxValueInput = document.getElementById('maxValue');
    const soundSelect = document.getElementById('soundSelect');

    const historyEl = document.getElementById('history');

    // 상태
    let value = 0;
    let timerId = null;
    let history = JSON.parse(localStorage.getItem('counterHistory') || '[]');

    // 사운드 (간단 beep)
    function playBeep(){
      if(soundSelect.value === 'beep'){
        try{
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = 'sine';
          o.frequency.value = 880;
          o.connect(g); g.connect(ctx.destination);
          o.start();
          g.gain.value = 0.05;
          setTimeout(()=>{ o.stop(); ctx.close(); }, 80);
        }catch(e){ /* 일부 브라우저에서 제한될 수 있음 */ }
      }
    }

    // 표시 포맷팅
    function formatNumber(n){
      const fmt = formatSelect.value;
      if(fmt === 'comma') return Number(n).toLocaleString();
      if(fmt === 'fixed2') return Number(n).toFixed(2);
      return String(n);
    }

    // UI 업데이트
    function render(){
      display.textContent = formatNumber(value);
      intervalLabel.textContent = intervalInput.value;
      stepLabel.textContent = stepInput.value;
      renderHistory();
    }

    // 히스토리 렌더
    function renderHistory(){
      historyEl.innerHTML = '';
      const slice = history.slice().reverse(); // 최신 먼저
      slice.forEach(item=>{
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `<div><strong>${item.label}</strong><div class="tiny">${new Date(item.time).toLocaleString()}</div></div><div style="text-align:right">${formatNumber(item.value)}</div>`;
        historyEl.appendChild(div);
      });
      if(slice.length === 0){
        historyEl.innerHTML = '<div class="tiny">히스토리가 없습니다. 동작하면 기록됩니다.</div>';
      }
    }

    // 한 스텝 증가
    function stepOnce(){
      const step = parseFloat(stepInput.value) || 1;
      const max = maxValueInput.value ? Number(maxValueInput.value) : null;
      let next = value + step;
      if(max !== null && !Number.isNaN(max) && next >= max){
        next = max;
        value = next;
        pushHistory('도달: 최대값', value);
        pause();
        playBeep();
        render();
        return;
      }
      value = next;
      pushHistory('증가', value);
      playBeep();
      render();
    }

    // 히스토리 푸시
    function pushHistory(label, val){
      const item = {label, value: val, time: new Date().toISOString()};
      history.push(item);
      // 히스토리 길이 제한 (최근 200개만 유지)
      if(history.length > 200) history.shift();
      localStorage.setItem('counterHistory', JSON.stringify(history));
    }

    // 시작
    function start(){
      if(timerId) return;
      const interval = Math.max(100, Number(intervalInput.value) || 1000);
      timerId = setInterval(stepOnce, interval);
      startPauseBtn.textContent = '일시정지';
      startPauseBtn.classList.add('primary');
    }

    // 일시정지
    function pause(){
      if(timerId){
        clearInterval(timerId);
        timerId = null;
      }
      startPauseBtn.textContent = '시작';
      startPauseBtn.classList.remove('primary');
    }

    function toggleStartPause(){
      if(timerId) pause(); else start();
    }

    // 리셋
    function reset(){
      pause();
      value = 0;
      pushHistory('리셋', value);
      render();
    }

    // 로컬 저장 (현재 값)
    function saveLocal(){
      const rec = {label:'수동 저장', value, time:new Date().toISOString()};
      history.push(rec);
      localStorage.setItem('counterHistory', JSON.stringify(history));
      alert('현재 값이 로컬 히스토리에 저장되었습니다.');
      render();
    }

    // 히스토리 다운로드 (CSV)
    function downloadHistory(){
      if(history.length === 0){ alert('히스토리가 없습니다.'); return; }
      const rows = [['label','value','time'], ...history.map(h=>[h.label, h.value, h.time])];
      const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\\n');
      const blob = new Blob([csv], {type: 'text/csv'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'counter_history.csv';
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    }

    // 이벤트 바인딩
    startPauseBtn.addEventListener('click', toggleStartPause);
    stepOnceBtn.addEventListener('click', stepOnce);
    resetBtn.addEventListener('click', reset);
    saveBtn.addEventListener('click', saveLocal);
    downloadHistoryBtn.addEventListener('click', downloadHistory);

    intervalInput.addEventListener('change', ()=>{
      // 타이머 재시작 시 새 간격 적용
      if(timerId){ pause(); start(); }
      render();
    });
    stepInput.addEventListener('change', render);
    formatSelect.addEventListener('change', render);

    // 페이지 로드 시 자동 시작 옵션 처리
    (function init(){
      render();
      if(autoStartSel.value === 'true' || autoStartSel.selectedOptions[0].value === 'true'){
        start();
      }
    })();

    // 단축키: Space = 시작/일시정지, R = 리셋, S = 저장
    window.addEventListener('keydown', (e)=>{
      if(e.code === 'Space'){ e.preventDefault(); toggleStartPause(); }
      if(e.key.toLowerCase() === 'r'){ reset(); }
      if(e.key.toLowerCase() === 's'){ saveLocal(); }
    });

    // 페이지를 벗어나면 타이머 정지 (권장)
    window.addEventListener('blur', ()=>{ /* optional pause on blur: pause(); */ });

    // 초기 렌더
    render();
  </script>
</body>
</html>
